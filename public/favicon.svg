<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C388" />
      <stop offset="50%" stop-color="#BF8431" />
      <stop offset="100%" stop-color="#8F5C1B" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Gradient Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#goldGrad)" />
  <!-- Inner Dark Luxury Background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#070C18" />
  <!-- City One Hotel Official Logo Image -->
  <image href="/assets/hotel/logo.png" x="6" y="14" width="52" height="36" preserveAspectRatio="xMidYMid meet" />
</svg>
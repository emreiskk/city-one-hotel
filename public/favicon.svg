<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C388" />
      <stop offset="50%" stop-color="#BF8431" />
      <stop offset="100%" stop-color="#8F5C1B" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Gradient Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#goldGrad)" />
  <!-- Inner Dark Luxury Background -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="#070C18" />
  <!-- C1 Serif Typography in Gold -->
  <text x="32" y="42" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#DEB57F" text-anchor="middle" letter-spacing="1">C1</text>
</svg>